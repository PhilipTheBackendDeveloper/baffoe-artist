<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1e1e" />
      <stop offset="100%" stop-color="#101010" />
    </linearGradient>
    <linearGradient id="bkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9ff00" />
      <stop offset="100%" stop-color="#aee600" />
    </linearGradient>
    <filter id="bkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="3" y="3" width="94" height="94" rx="22" ry="22" fill="url(#bkBg)" stroke="#ccff00" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Monogram B (Left - Crisp White Fine Art Architecture) -->
  <!-- B Main Stem -->
  <path d="M 22 25 L 43 25 C 50 25 54 29 54 35.5 C 54 41 50 44.5 44 45.5 C 51 46.5 56 50.5 56 57.5 C 56 65 50 69 42 69 L 22 69 Z" fill="#F8F8F8"/>
  <!-- Cutouts inside B -->
  <path d="M 30 32 L 41 32 C 44 32 46.5 33.5 46.5 36 C 46.5 38.5 44 40 41 40 L 30 40 Z" fill="#151414"/>
  <path d="M 30 47 L 42 47 C 45 47 48 48.5 48 52 C 48 55.5 45 57 42 57 L 30 57 Z" fill="#151414"/>

  <!-- Monogram K (Right - Electric Gold/Lime Dynamic Brush Angles) -->
  <!-- K Main Stem -->
  <rect x="54" y="25" width="8" height="44" rx="2" fill="url(#bkGold)"/>
  <!-- K Upper Arm -->
  <polygon points="60,45 74,25 84,25 67,49" fill="url(#bkGold)"/>
  <!-- K Lower Arm -->
  <polygon points="63,45 84,69 74,69 57,51" fill="url(#bkGold)"/>

  <!-- Akan Diamond Sparkle Accent at Top Right -->
  <path d="M 83 14 L 85 20 L 91 22 L 85 24 L 83 30 L 81 24 L 75 22 L 81 20 Z" fill="#ccff00" filter="url(#bkGlow)"/>
</svg>
